name: Tashqi savdo ma'lumotlari (UN Comtrade)

# Ikki rejim:
#   - KUNLIK (04:00 UTC): faqat yetishmayotgan davlatlarni yuklaydi (resume).
#     Hammasi bor bo'lsa — 0 so'rov, commit bo'lmaydi.
#   - OYLIK (oyning 2-si): butun ro'yxatni yangilaydi (--force, ~260 so'rov,
#     bepul kvota 500/kun ichida).
on:
  schedule:
    - cron: '0 4 * * *'
    - cron: '0 4 2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Paketlarni o'rnatish
        run: npm ci --no-audit --no-fund

      - name: Kunlik — yetishmayotgan davlatlar
        if: github.event.schedule != '0 4 2 * *'
        run: node scripts/fetch-comtrade.mjs --limit 12
        env:
          COMTRADE_KEY: ${{ secrets.COMTRADE_KEY }}

      - name: Oylik — to'liq yangilash
        if: github.event.schedule == '0 4 2 * *'
        run: node scripts/fetch-comtrade.mjs --force --limit 100
        env:
          COMTRADE_KEY: ${{ secrets.COMTRADE_KEY }}

      - name: O'zgarishlarni commit qilish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/comtrade)" ]; then
            git add data/comtrade
            git commit -m "Tashqi savdo ma'lumotlari yangilandi (UN Comtrade): $(date -u +'%Y-%m-%d')"
            git push
          else
            echo "O'zgarish yo'q."
          fi
